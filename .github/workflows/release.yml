name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - os: windows
            arch: amd64
            output: soc.exe
          - os: linux
            arch: amd64
            output: soc-linux
          - os: darwin
            arch: amd64
            output: soc-darwin-amd64
          - os: darwin
            arch: arm64
            output: soc-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p build
          go build -ldflags="-s -w" -o build/${{ matrix.output }} ./cmd/agent/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: build/${{ matrix.output }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          for d in dist/*/; do
            [ -d "$d" ] || continue
            f=$(basename "$d")
            [ -f "$d$f" ] || continue
            mv "$d$f" "dist/${f}.tmp"
            rmdir "$d"
            mv "dist/${f}.tmp" "dist/$f"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
